# Weekly merge of the original Xtra (crackededed/Xtra) into the TV fork.
# It publishes only when the merge has no conflicts, the APK builds, the TV manifest is right and the smoke test on an
# Android TV emulator passes. Otherwise nothing is pushed and the run (and an issue, when issues are enabled) says why.
name: Upstream sync

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      force_test:
        description: Build and run the smoke test even if upstream has nothing new (nothing is pushed then)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/crackededed/Xtra.git
  UPSTREAM_BRANCH: master
  APK: app/build/outputs/apk/release/app-release.apk

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # a token with the workflow permission is only needed when upstream changes .github/workflows
        token: ${{ secrets.SYNC_TOKEN || github.token }}

    - name: Merge upstream
      id: merge
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
        git remote add upstream "$UPSTREAM"
        git fetch --no-tags upstream "$UPSTREAM_BRANCH"
        upstream_head=$(git rev-parse FETCH_HEAD)
        echo "upstream_head=$upstream_head" >> "$GITHUB_OUTPUT"
        if git merge-base --is-ancestor "$upstream_head" HEAD; then
          echo "Already up to date with upstream ${upstream_head:0:8}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
        git log --oneline --no-decorate "HEAD..$upstream_head" > upstream-commits.txt
        cat upstream-commits.txt
        if ! git merge --no-ff --no-edit -m "Sincronizar con upstream (crackededed/Xtra) ${upstream_head:0:8}" "$upstream_head"; then
          git diff --name-only --diff-filter=U > conflicts.txt
          cat conflicts.txt
          git merge --abort
          echo "Hay conflictos al mezclar upstream: hay que resolverlos a mano." > reason.txt
          echo "::error::Merge conflicts with upstream"
          exit 1
        fi
        if git diff --name-only HEAD^1 HEAD | grep -q '^\.github/workflows/'; then
          echo "workflows_changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Check the push permission
      if: steps.merge.outputs.workflows_changed == 'true'
      env:
        HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
      run: |
        if [ "$HAS_SYNC_TOKEN" != "true" ]; then
          echo "Upstream ha cambiado archivos de .github/workflows y subirlos necesita el secret SYNC_TOKEN (token de grano fino con permisos Contents y Workflows de escritura)." > reason.txt
          echo "::error::Upstream changed .github/workflows: a SYNC_TOKEN secret is needed"
          exit 1
        fi

    - name: Setup Java
      if: steps.merge.outputs.changed == 'true' || inputs.force_test
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      if: steps.merge.outputs.changed == 'true' || inputs.force_test
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: 'basic'

    - name: Build with Gradle
      if: steps.merge.outputs.changed == 'true' || inputs.force_test
      run: |
        echo "No compila con los cambios de upstream." > reason.txt
        ./gradlew assembleRelease
        rm reason.txt

    - name: Check the TV manifest
      if: steps.merge.outputs.changed == 'true' || inputs.force_test
      run: |
        echo "El manifiesto final del APK no es correcto para TV." > reason.txt
        bash .github/scripts/check-tv-manifest.sh "$APK"
        rm reason.txt

    - name: Enable KVM
      if: steps.merge.outputs.changed == 'true' || inputs.force_test
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Smoke test on an Android TV emulator
      if: steps.merge.outputs.changed == 'true' || inputs.force_test
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 30
        target: android-tv
        arch: x86
        disable-animations: true
        script: bash .github/scripts/tv-smoke-test.sh "$APK" || { echo "La prueba en el emulador de Android TV ha fallado (cierre, ANR o pantalla equivocada)." > reason.txt; exit 1; }

    - name: Push to master
      if: steps.merge.outputs.changed == 'true'
      run: |
        echo "No se pudo subir la mezcla a master (¿hubo un push mientras tanto?)." > reason.txt
        git push origin HEAD:master
        rm reason.txt
        {
          echo "Mezclado upstream ${{ steps.merge.outputs.upstream_head }}:"
          sed 's/^/- /' upstream-commits.txt
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Start the TV release
      if: steps.merge.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
      run: |
        # pushes made with the workflow token start no other workflows, so the release is started here;
        # with SYNC_TOKEN the push itself starts it
        if [ "$HAS_SYNC_TOKEN" != "true" ]; then
          gh workflow run tv-release.yml --ref master
        fi

    - name: Report the failure
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
      run: |
        {
          echo "La sincronización automática con crackededed/Xtra se ha detenido y no se ha publicado nada."
          echo
          if [ -s reason.txt ]; then cat reason.txt; echo; fi
          echo "- Ejecución: $RUN_URL"
          echo "- Commit de upstream: ${UPSTREAM_HEAD:-desconocido}"
          if [ -s conflicts.txt ]; then
            echo
            echo "Archivos con conflictos:"
            sed 's/^/- /' conflicts.txt
          fi
          if [ -s upstream-commits.txt ]; then
            echo
            echo "Commits nuevos de upstream:"
            sed 's/^/- /' upstream-commits.txt
          fi
        } > report.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"
        if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = "true" ]; then
          title="Sincronización con upstream detenida"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
        fi
